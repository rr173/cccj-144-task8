<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>工器具借还台 · 配电检修安全票</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif; background:#0f1620; color:#dbe4ee; }
  header { padding:10px 18px; background:#16202e; border-bottom:1px solid #263449; display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
  header h1 { font-size:17px; margin:0; color:#7fd0ff; }
  header a { color:#9fb3c8; font-size:13px; }
  main { display:grid; grid-template-columns: 1.15fr 1fr; gap:10px; padding:10px; }
  .card { background:#16202e; border:1px solid #263449; border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .card h3 { margin:0 0 8px; font-size:14px; color:#7fd0ff; }
  button { background:#1f6feb; color:#fff; border:0; border-radius:5px; padding:5px 12px; cursor:pointer; font-size:13px; margin:2px;}
  button:hover { background:#388bfd; }
  button.ghost { background:#2a3a4f; }
  button.danger { background:#b8323e; }
  button.warn { background:#8a6d1a; }
  button:disabled { background:#3a4a5f; cursor:not-allowed; }
  input,select { background:#0b1119; color:#dbe4ee; border:1px solid #33465e; border-radius:5px; padding:4px 8px; font-size:13px; margin:2px;}
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td,th { padding:3px 6px; border-bottom:1px solid #22303f; text-align:left; vertical-align:top;}
  th { color:#9fb3c8; font-weight:600;}
  .tag { display:inline-block; padding:1px 7px; border-radius:9px; font-size:11px; margin:1px;}
  .st-FREE { background:#143a24; color:#3fb950;}
  .st-LOCKED { background:#1c2f4a; color:#6cb0ff;}
  .st-ISSUED { background:#3d3416; color:#d4a72c;}
  .st-BLOCKED, .st-MAINTENANCE { background:#3d1d1f; color:#e5534b;}
  .bx-READY { background:#1c2f4a; color:#6cb0ff;}
  .bx-HELD { background:#1a7f4b; color:#fff;}
  .bx-RETURNED { background:#263449; color:#9fb3c8;}
  .bx-REVIEW, .bx-BLOCKED { background:#5a3038; color:#ffb3ae;}
  .ev-ACCEPTED { color:#2ea043;} .ev-PENDING { color:#d4a72c;} .ev-REJECTED { color:#e5534b;}
  .ev-DUPLICATE { color:#9fb3c8;}
  #log { max-height:380px; overflow-y:auto; font-size:12px; font-family:ui-monospace,monospace; background:#0b1119; border-radius:6px; padding:8px;}
  #log div { padding:2px 4px; border-bottom:1px solid #1c2836; white-space:pre-wrap;}
  .muted { color:#8fa3b8; font-size:11.5px; }
  .ok { color:#2ea043; } .err { color:#e5534b; } .warn-t { color:#d4a72c; }
  .full { grid-column: 1 / -1; }
  .mono { font-family:ui-monospace,monospace; font-size:11.5px; }
  .scenes button { margin-bottom:5px;}
  details summary { cursor:pointer; color:#9fb3c8; font-size:12px;}
  .reason { color:#ffb454; }
</style>
</head>
<body>
<header>
  <h1>🧰 工器具借还台</h1>
  <a href="/" target="_blank">→ 调度端</a>
  <a href="/field" target="_blank">→ 现场操作页</a>
  <a href="/shift" target="_blank">→ 换班接续台</a>
  <a href="/replay" target="_blank">→ 审计回放</a>
  <a href="/metro" target="_blank">→ 计量检定与召回</a>
  <a href="/voucher" target="_blank">→ 凭证柜</a>
  <span id="clock" style="margin-left:auto;font-size:12px;color:#9fb3c8"></span>
</header>
<main>
  <!-- ================= 场景脚本 ================= -->
  <section>
    <div class="card scenes">
      <h3>场景一键演示（每个脚本独立建票/箱，跑完即留痕可查）</h3>
      <button onclick="runScene('happy')">① 齐套领用→移交→归还全流程</button>
      <button onclick="runScene('dup')">② 重复扫码（返回原校验串，不多扣库存）</button>
      <button onclick="runScene('race')">③ 两负责人并发争抢同一箱（唯一持权）</button>
      <button onclick="runScene('offline')">④ 断网补送（缺前序挂起→补到唤醒→重复不扣）</button>
      <button onclick="runScene('damage')">⑤ 归还损坏/封签差异（置待复核·禁借）</button>
      <button onclick="runScene('rollback')">⑥ 撤回安全票→库存锁整批回滚</button>
      <button onclick="runScene('restart')">⑦ 服务重启后继续处理挂起队列</button>
      <button class="warn" onclick="runScene('reject')">⑧ 异常扫码（批次不符/他票占用/未锁定/封签破损/超期）</button>
      <button class="ghost" onclick="load()">刷新看板</button>
    </div>
    <div class="card">
      <h3>处理日志（含每条裁决原因）</h3>
      <div id="log"><div class="muted">点击上方按钮运行场景；全部动作走真实 HTTP 接口与 SQLite 持久化。</div></div>
    </div>
  </section>

  <!-- ================= 借还台看板 ================= -->
  <section>
    <div class="card">
      <h3>安全票 → 工具箱</h3>
      <div id="boxes"></div>
    </div>
    <div class="card">
      <h3>库存锁 · 校验串 · 持有人</h3>
      <div id="locks"></div>
    </div>
    <div class="card">
      <h3>断网补送队列（按客户端位置）</h3>
      <div id="scans"></div>
    </div>
  </section>

  <section class="full">
    <div class="card">
      <h3>单件工具库存（含批次/磨损/封签）</h3>
      <div id="tools"></div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
function esc(s){ return String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(ms){ return ms ? new Date(ms).toLocaleString('zh-CN',{hour12:false}) : '-'; }
async function api(method, url, body){
  const opt = {method, headers:{'Content-Type':'application/json'}};
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  let j = null; try { j = await r.json(); } catch(e) {}
  return {status:r.status, ok:r.ok, j};
}
function log(msg, cls=''){
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = '[' + new Date().toLocaleTimeString('zh-CN',{hour12:false}) + '] ' + msg;
  $('#log').prepend(d);
}
function logj(label, r){
  const d = r.j && r.j.detail ? r.j.detail : r.j;
  log(`${label} → HTTP ${r.status}  ` + (d ? JSON.stringify(d) : ''),
      r.ok ? 'ok' : 'err');
}
// ---- 每次演示运行的唯一编号（箱号/客户端号不撞车，可反复运行） ----
let runSeq = 0;
function runId(){ return ++runSeq; }

// 候选工作区：两组互不重叠的馈线（同组内跨边界开关也可能冲突，逐个尝试直到建票成功）
const WA_CANDIDATES = ['F2','F3','F1','T1','N2'];
async function newTicket(tag, workArea=null){
  const areas = workArea ? [workArea] : WA_CANDIDATES;
  let lastErr = null;
  for (const wa of areas){
    const r = await api('POST','/api/tickets',{title:`借还台演示·${tag}`,work_area:[wa],created_by:'调度A'});
    if (r.ok) { log(`建票 ${r.j.id}（工作区 ${wa}）`); return r.j; }
    lastErr = r;
  }
  throw new Error('候选工作区均被既有安全票占用，请先在调度端关闭/撤回旧票：' + JSON.stringify(lastErr.j));
}
async function twoTickets(tag){
  // 需要两张互不冲突的票：在锁定任何设备前先把两张票都建出来
  const t1 = await newTicket(tag + '·票一');
  const used = t1.work_area[0];
  const rest = WA_CANDIDATES.filter(x => x !== used);
  const t2 = await newTicket(tag + '·票二', rest[0]);
  return [t1, t2];
}
async function lockBox(t, boxId, deadlineHours=8){
  const lk = await api('POST',`/api/tickets/${t.id}/tool-locks`,{});
  if (!lk.ok) throw new Error('锁定失败: ' + JSON.stringify(lk.j));
  const b = await api('POST',`/api/tickets/${t.id}/tool-boxes`,
                      {box_id:boxId, deadline_hours:deadlineHours});
  if (!b.ok) throw new Error('建箱失败: ' + JSON.stringify(b.j));
  return {lock:lk.j, box:b.j};
}
async function scanAll(boxId, box, clientId='PDA-'+Math.random().toString(36).slice(2,7)){
  for (const l of box.lines){
    const r = await api('POST',`/api/tool-boxes/${boxId}/scan`,{client_id:clientId, serial:l.serial});
    if (!r.j.ok) throw new Error(`扫码 ${l.serial} 失败: ${r.j.reason}`);
  }
  return clientId;
}
// 场景收尾：未齐套/被拒箱作废回滚工具，再撤回票释放设备控制权，保证可反复演示
async function cleanup(t, boxId){
  const b = await api('GET',`/api/tool-boxes/${boxId}`);
  if (b.ok && ['READY','BLOCKED'].includes(b.j.status))
    await api('POST',`/api/tool-boxes/${boxId}/abort`,{reason:'演示收尾：作废并回滚库存'});
  await api('POST',`/api/tickets/${t.id}/withdraw`,{actor:'调度A',reason:'演示收尾：释放设备控制权'});
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ================= 场景脚本 =================
const scenes = {
  async happy(){
    const n=runId(), t=await newTicket('齐套');
    const boxId='BX-HAPPY'+n;
    const req=(await api('GET',`/api/tools/requirements/${t.id}`)).j;
    log(`① 安全票 ${t.id}：隔离步骤 ${req.step_count} 步；必需工具 ` +
        req.lines.map(l=>`${l.name}×${l.qty}`).join('，'));
    const {box}=await lockBox(t,boxId,8);
    log(`① 库管员按批次锁定 ${box.total} 件，工具箱 ${boxId} 就绪（封签 ${box.seal}，期限 ${fmt(box.deadline_ms)}）`,'ok');
    for (const l of box.lines){
      const r=await api('POST',`/api/tool-boxes/${boxId}/scan`,{client_id:'PDA-H'+n,serial:l.serial});
      log(`① 扫码 ${l.serial} → ${r.j.reason_code} 校验串 ${r.j.checksum}`);
    }
    const v=await api('GET',`/api/tool-boxes/${boxId}/verify/${box.lines[0].serial}`);
    log(`① 服务端复核校验串 valid=${v.j.valid}（重算值与领用落库值一致）`, v.j.valid?'ok':'err');
    const h=await api('POST',`/api/tool-boxes/${boxId}/handover`,{leader:'王负责',team:'甲班'});
    logj('① 齐套+封签完好+未超期 → 移交', h);
    const items=box.lines.map(l=>({serial:l.serial,code:l.code,wear:'OK',seal_ok:true}));
    const rt=await api('POST',`/api/tool-boxes/${boxId}/return`,{box_seal:'S-OK',items});
    logj('① 归还数量/磨损/封签逐项对照无差异，工具回库、锁释放', rt);
    await cleanup(t,boxId);
  },

  async dup(){
    const n=runId(), t=await newTicket('重复扫码');
    const boxId='BX-DUP'+n; const {box}=await lockBox(t,boxId);
    const sn=box.lines[0].serial, key='K-DUP'+n;
    const r1=await api('POST',`/api/tool-boxes/${boxId}/scan`,{client_id:'PDA-D1',serial:sn,key});
    const r2=await api('POST',`/api/tool-boxes/${boxId}/scan`,{client_id:'PDA-D1',serial:sn,key});
    const r3=await api('POST',`/api/tool-boxes/${boxId}/scan`,{client_id:'PDA-D2',serial:sn});
    log(`② 首扫 ${sn}：${r1.j.reason_code} ${r1.j.checksum}`);
    log(`② 同扫码器+同幂等键重复：duplicate=${r2.j.duplicate}，校验串一致=${r2.j.checksum===r1.j.checksum}`);
    log(`② 换另一台扫码器再扫同一件：duplicate=${r3.j.duplicate}，仍返回首次校验串`, 'warn-t');
    const bv=(await api('GET',`/api/tool-boxes/${boxId}`)).j;
    log(`② 该件领用记录=${bv.lines.filter(l=>l.serial===sn&&l.checked_out).length} 条，库存只扣一件`, 'ok');
    await cleanup(t,boxId);
  },

  async race(){
    const n=runId(), t=await newTicket('争抢');
    const boxId='BX-RACE'+n; const {box}=await lockBox(t,boxId);
    await scanAll(boxId,box,'PDA-R'+n);
    log('③ 齐套，王负责（甲班）/赵负责（乙班）同一刻并发发起移交…');
    const [a,b]=await Promise.all([
      api('POST',`/api/tool-boxes/${boxId}/handover`,{leader:'王负责',team:'甲班'}),
      api('POST',`/api/tool-boxes/${boxId}/handover`,{leader:'赵负责',team:'乙班'}),
    ]);
    logj('③ 候选甲（王负责）', a);
    logj('③ 候选乙（赵负责）', b);
    const winner=a.ok?'王负责':(b.ok?'赵负责':'无人');
    log(`③ 数据库 CAS：唯一持权人=${winner}；负方收到带中签者的 HOLDER_TAKEN 并落 tool_reasons`,'warn-t');
    // 持有箱必须走归还（无差异回库），不能作废
    const items=box.lines.map(l=>({serial:l.serial,code:l.code,wear:'OK',seal_ok:true}));
    await api('POST',`/api/tool-boxes/${boxId}/return`,{box_seal:'S-OK',items});
    await cleanup(t,boxId);
  },

  async offline(){
    const n=runId(), t=await newTicket('断网');
    const boxId='BX-OFF'+n, cid='PDA-OFF'+n; const {box}=await lockBox(t,boxId);
    const sn=box.lines.map(l=>l.serial);
    log('④ 现场断网：扫码器把扫码动作写入本地队列（位置 1/2/3/4）');
    let r=await api('POST','/api/tool-scans/flush',{client_id:cid,items:[
      {client_seq:1,box:boxId,serial:sn[0]},
      {client_seq:2,box:boxId,serial:sn[1]},
      {client_seq:4,box:boxId,serial:sn[3]}]});
    log('④ 恢复连接按客户端位置补送 1,2,4：' + r.j.results.map(x=>`#${x.client_seq}:${x.status}`).join(' '));
    log('④ #4 缺前置 #3 → PENDING 挂起，不跨越、不扣 #4 库存','warn-t');
    r=await api('POST','/api/tool-scans/flush',{client_id:cid,items:[
      {client_seq:1,box:boxId,serial:sn[0]},
      {client_seq:3,box:boxId,serial:sn[2]}]});
    log('④ 再补：#1 重复回原结果（duplicate），#3 到达 → 链式唤醒 ' +
        r.j.woken.map(w=>`#${w.client_seq}:${w.result.reason_code}`).join(','),'ok');
    r=await api('POST','/api/tool-scans/flush',{client_id:cid,items:[
      {client_seq:1,box:boxId,serial:sn[0]},
      {client_seq:2,box:boxId,serial:sn[1]},
      {client_seq:4,box:boxId,serial:sn[3]}]});
    log('④ 整包重复补送：全部 duplicate=true，校验串不变，无二次扣库存','ok');
    await cleanup(t,boxId);
  },

  async damage(){
    const n=runId(), t=await newTicket('损坏差异');
    const boxId='BX-DMG'+n; const {box}=await lockBox(t,boxId);
    await scanAll(boxId,box,'PDA-M'+n);
    await api('POST',`/api/tool-boxes/${boxId}/handover`,{leader:'王负责',team:'甲班'});
    const bad=box.lines[0].serial, cut=box.lines[1].serial;
    const items=box.lines.map(l=>({serial:l.serial,code:l.code,
      wear:l.serial===bad?'BAD':'OK', seal_ok:l.serial!==cut}));
    const rt=await api('POST',`/api/tool-boxes/${boxId}/return`,{box_seal:'S-CUT',items});
    logj('⑤ 归还清点：1件磨损 + 1件封签变化 + 箱封签变化', rt);
    log(`⑤ 工具箱 → ${rt.j.status}，差异件全部 BLOCKED，禁止再次借出`,'err');
    const again=await api('POST',`/api/tool-boxes/${boxId}/handover`,{leader:'任何人',team:'甲班'});
    logj('⑤ 待复核箱再次借出被拒', again);
    const rv=await api('POST',`/api/tool-boxes/${boxId}/review`,{action:'CONFIRM_LOSS'});
    logj('⑤ 库管员复核确认缺损：坏件转 MAINTENANCE，其余回库，箱结案', rv);
    // 演示可重复：坏件"维修/更换完成"后回库
    const rp=await api('POST',`/api/tools/repair/${bad}`,{actor:'库管员'});
    logj('⑤ 坏件维修/更换完成恢复在库（下轮演示可再用）', rp);
    await cleanup(t,boxId);
  },

  async rollback(){
    const n=runId(), t=await newTicket('回滚');
    const boxId='BX-RB'+n;
    const lk=await api('POST',`/api/tickets/${t.id}/tool-locks`,{});
    log(`⑥ 库管员已为 ${t.id} 批次锁定 ${lk.j.lines.length} 件`);
    const before=(await api('GET','/api/tools/inventory')).j.tools.filter(x=>x.state==='FREE').length;
    const w=await api('POST',`/api/tickets/${t.id}/withdraw`,{actor:'调度A',reason:'计划取消'});
    const after=(await api('GET','/api/tools/inventory')).j.tools.filter(x=>x.state==='FREE').length;
    logj('⑥ 调度撤回安全票', w);
    log(`⑥ 库存回滚：在库空闲 ${before} → ${after}（+${after-before}），tool_locks 全部 RELEASED`,'ok');
  },

  async reject(){
    const n=runId();
    const [t1,t2]=await twoTickets('异常占用');
    const boxId='BX-RJ'+n; const {box:b1}=await lockBox(t1,boxId);
    let r=await api('POST',`/api/tool-boxes/${boxId}/scan`,{client_id:'PDA-X',serial:'WRENCH-B2401-01'});
    logj('⑧ 扫码件不在本票锁定清单（NOT_LOCKED_FOR_TICKET，未扣库存）', r);
    r=await api('POST',`/api/tool-boxes/${boxId}/scan`,{client_id:'PDA-X',serial:'NO-SUCH-99'});
    logj('⑧ 扫码不存在的工具编号', r);
    const sn=b1.lines[0].serial;
    r=await api('POST',`/api/tickets/${t2.id}/tool-locks`,{serials:{GLOVE:[sn]}});
    logj(`⑧ 另一张安全票试图锁定已被票一占有的 ${sn}（ITEM_OCCUPIED_BY_TICKET）`, r);
    await api('POST',`/api/tool-boxes/${boxId}/scan`,{client_id:'PDA-X',serial:sn});
    r=await api('POST',`/api/tool-boxes/${boxId}/handover`,{leader:'王负责',team:'甲班'});
    logj('⑧ 缺件移交被拒（BOX_NOT_COMPLETE，箱保持 READY，原因落库）', r);
    await cleanup(t1,boxId);
    await api('POST',`/api/tickets/${t2.id}/withdraw`,{actor:'调度A',reason:'演示收尾'});

    // 封签破损
    const t3=await newTicket('封签'); const bsid='BX-SEAL'+n;
    const {box:b3}=await lockBox(t3,bsid);
    await scanAll(bsid,b3,'PDA-S'+n);
    r=await api('POST',`/api/tool-boxes/${bsid}/handover`,{leader:'王负责',team:'甲班',seal_intact:false});
    logj('⑧ 封签破损移交被拒（SEAL_BROKEN，箱 → BLOCKED）', r);
    await cleanup(t3,bsid);

    // 超过交接期限（deadline_hours=0 立即可判定超期）
    const t4=await newTicket('超期'); const blid='BX-LATE'+n;
    const {box:b4}=await lockBox(t4,blid,0);
    await scanAll(blid,b4,'PDA-L'+n);
    r=await api('POST',`/api/tool-boxes/${blid}/handover`,{leader:'王负责',team:'甲班'});
    logj('⑧ 超过交接期限移交被拒（HANDOVER_DEADLINE_PASSED）', r);
    await cleanup(t4,blid);
    log('⑧ 批次不符（BATCH_MISMATCH）场景由自动化测试 test_scan_batch_mismatch 覆盖','muted');
  },

  async restart(){
    const n=runId(), t=await newTicket('重启');
    const boxId='BX-RS'+n, cid='PDA-RES'+n; const {box}=await lockBox(t,boxId);
    const sn=box.lines.map(l=>l.serial);
    await api('POST','/api/tool-scans/flush',{client_id:cid,items:[
      {client_seq:1,box:boxId,serial:sn[0]},
      {client_seq:3,box:boxId,serial:sn[2]}]});
    log('⑦ 断网补送 #1 已采纳、#3 因缺 #2 挂起；调用 /api/admin/reopen 模拟服务进程重启…');
    const ro=await api('POST','/api/admin/reopen',{});
    logj('⑦ 进程重启完成，全部状态自 SQLite 恢复', ro);
    const evs=(await api('GET',`/api/tool-scans/${cid}`)).j;
    log('⑦ 重启后客户端游标完整：' + evs.map(e=>`#${e.client_seq}:${e.status}`).join(' '));
    const v=await api('GET',`/api/tool-boxes/${boxId}/verify/${sn[0]}`);
    log(`⑦ 重启后校验串复核 valid=${v.j.valid}（HMAC 密钥持久化于 meta，重算值不变）`, v.j.valid?'ok':'err');
    const r=await api('POST','/api/tool-scans/flush',{client_id:cid,items:[
      {client_seq:2,box:boxId,serial:sn[1]}]});
    log('⑦ 连接恢复补送 #2 → #3 自动链式唤醒：' +
        r.j.woken.map(w=>`#${w.client_seq}:${w.result.reason_code}`).join(','),'ok');
    await cleanup(t,boxId);
  },
};

async function runScene(name){
  try { await scenes[name](); }
  catch(e){ log('✗ 场景异常: ' + e.message, 'err'); console.error(e); }
  load();
}

// ================= 看板渲染 =================
function render(){
  $('#clock').textContent = new Date().toLocaleString('zh-CN',{hour12:false});
}
setInterval(render, 1000); render();

async function load(){
  const b = (await api('GET','/api/tools/board')).j;
  // 工具箱
  $('#boxes').innerHTML = b.boxes.length ? `<table>
    <tr><th>工具箱</th><th>安全票</th><th>状态</th><th>齐套</th><th>封签</th><th>持有人</th><th>期限</th><th>处理原因</th></tr>
    ${b.boxes.map(x=>`<tr>
      <td><b>${esc(x.id)}</b></td>
      <td class="mono">${esc(x.ticket)}</td>
      <td><span class="tag bx-${x.status}">${x.status}</span>${x.deadline_passed?'<span class="tag bx-REVIEW">已超期</span>':''}</td>
      <td>${x.issued}/${x.total}</td>
      <td>${x.seal_broken?'<span class="err">破损</span>':'<span class="ok">完好</span>'}<div class="muted mono">${esc(x.seal)}</div></td>
      <td>${x.holder?`<b>${esc(x.holder)}</b><div class="muted">${esc(x.holder_team||'')}</div>`:'<span class="muted">—</span>'}</td>
      <td class="muted">${fmt(x.deadline_ms)}</td>
      <td>${(x.reasons||[]).map(r=>`<div class="reason">【${esc(r.scene)}】${esc(r.reason_code)}：${esc(r.detail)}</div>`).join('')||'<span class="muted">-</span>'}
        ${(x.checkouts||[]).length?`<details><summary class="muted">历史领用/校验串 ${x.checkouts.length} 件</summary>
          <div class="mono">${x.checkouts.map(co=>`#${co.seq} ${esc(co.serial)} ${esc(co.checksum)}（领时磨损 ${esc(co.wear_at_issue||'OK')} / ${co.seal_ok_at_issue?'封签完好':'封签破损'}）`).join('<br>')}</div>
        </details>`:''}
      </td>
    </tr>`).join('')}</table>` : '<div class="muted">暂无工具箱</div>';

  // 锁
  $('#locks').innerHTML = b.locks.length ? `<table>
    <tr><th>安全票</th><th>工具编号</th><th>型号</th><th>批次</th></tr>
    ${b.locks.map(l=>`<tr><td class="mono">${esc(l.ticket)}</td><td class="mono">${esc(l.serial)}</td><td>${esc(l.code)}</td><td>${esc(l.batch)}</td></tr>`).join('')}
  </table>` : '<div class="muted">无生效库存锁</div>';

  // 扫码队列
  $('#scans').innerHTML = b.scan_events.length ? `<table>
    <tr><th>客户端/位置</th><th>箱</th><th>工具</th><th>状态</th><th>裁决原因 / 校验串</th></tr>
    ${b.scan_events.map(e=>`<tr>
      <td class="mono">${esc(e.client_id)} #${e.client_seq}</td>
      <td>${esc(e.box)}</td><td class="mono">${esc(e.serial)}</td>
      <td class="ev-${e.status}">${e.status}</td>
      <td class="mono">${esc(e.result.reason_code)} ${e.result.checksum?('· '+e.result.checksum):''}<div class="muted">${esc(e.result.reason||'')}</div></td>
    </tr>`).join('')}</table>` : '<div class="muted">暂无补送记录</div>';

  // 库存
  $('#tools').innerHTML = `<table>
    <tr><th>型号</th><th>单件编号</th><th>批次</th><th>状态</th><th>磨损</th><th>封签</th></tr>
    ${b.tools.map(t=>`<tr>
      <td>${esc(t.code)}</td><td class="mono">${esc(t.serial)}</td><td>${esc(t.batch_id)}</td>
      <td><span class="tag st-${t.state}">${t.state}</span></td>
      <td class="${t.wear==='BAD'?'err':''}">${esc(t.wear)}</td>
      <td>${t.seal_ok?'<span class="ok">完好</span>':'<span class="err">破损</span>'}</td>
    </tr>`).join('')}</table>`;
}
load();
</script>
