<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷暴撤离移动端</title>
<style>
body{margin:0;background:#0d172b;color:#eaf1ff;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;padding-bottom:30px}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#16233e;border:1px solid #2b3f63;border-radius:14px;padding:14px;margin:12px 0}h1{font-size:20px}h2{font-size:16px;margin:0 0 10px}label{display:block;color:#aebfdd;font-size:12px;margin:8px 0 4px}select,input,button,textarea{width:100%;padding:10px;border-radius:9px;border:1px solid #3a4e73;background:#0c1628;color:#eaf1ff}button{background:#1d6fd1;border-color:#4a8fde;cursor:pointer;font-weight:700}button.secondary{background:#29405f}button.green{background:#16824d}button.red{background:#9c3030}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{padding:2px 8px;border-radius:999px;background:#304a72;font-size:12px}.bad{color:#ff7676}.ok{color:#4ade80}.warn{color:#ffc85c}.mono{font-family:ui-monospace,monospace;font-size:11px}li{margin:7px 0}.reason{background:#2a1720;border:1px solid #633;border-radius:9px;padding:8px;color:#ffd7d7}.okmsg{background:#143023;border:1px solid #2c6a48;border-radius:9px;padding:8px}.muted{color:#95a8c8;font-size:12px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #2b3f63;padding:6px;text-align:left}a{color:#9dccff}
</style></head><body><div class=wrap>
<h1>雷暴撤离 · 移动端</h1><div class="row"><a href="/storm"><button class=secondary>调度端</button></a><button onclick="load()">刷新</button></div>
<div class=card><h2>选择批次与本人</h2><label>撤离批次</label><select id=batch></select><label>成员（模拟扫码登录）</label><select id=person></select></div>
<div class=card><h2>扫码到达避险点</h2><div class=row><button onclick="checkin('SH-A',true)">扫码：一号避险点·确认安全</button><button onclick="checkin('SH-B',true)">扫码：二号避险点·确认安全</button></div><div class=row style="margin-top:8px"><button class=secondary onclick="checkin('SH-A',false)">仅到达，稍后确认安全</button><button class=green onclick="confirmSafe()">补确认本人安全</button></div><p class=muted>同一人换点只保留最新有效去向；重复扫码返回首次结果；代签、已离场、未登记都会被拒绝并落裁决。</p><button class=secondary onclick="proxyTest()">模拟代签（演示拒绝）</button></div>
<div class=card><h2>纠正去向</h2><div class=row><button onclick="correct('SH-A')">我实际在一号点</button><button onclick="correct('SH-B')">我实际在二号点</button></div></div>
<div class=card><h2>风险监护与工器具清点</h2><label>风险点</label><select id=risk></select><div class=row><button onclick="guard()">落实我为监护人</button></div><label>关键器具编号</label><select id=tool></select><label>去向位置</label><input id=location value="一号避险点工器具筐"><div class=row><button onclick="reportTool(false)">提交器具去向</button><button class=red onclick="reportTool(true)">现场负责人强制裁决最新去向</button></div></div>
<div class=card><h2>现场负责人清点</h2><button class=green onclick="fieldConfirm()">陈七提交人员与器具清点确认</button><p class=muted>人员未全部确认安全、关键器具不明或去向冲突时，服务端返回明确拒绝原因。</p></div>
<div class=card><h2>我的状态与拒绝原因</h2><div id=me></div><h2>批次未清项</h2><div id=items></div><h2>裁决记录</h2><ul id=logs></ul></div>
</div><script>
let board={},batch=null;
const $=id=>document.getElementById(id);async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});let d={};try{d=await r.json()}catch{};if(!r.ok){show(d);throw d}show(d);return d}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function show(d){const x=d.detail;if(x){const msg=typeof x==='object'?`${x.reason_code||''}: ${x.detail||''}`:x;$('logs').insertAdjacentHTML('afterbegin',`<li class=reason>${esc(msg)}</li>`)}else if(d.reason_code||d.result){$('logs').insertAdjacentHTML('afterbegin',`<li class=okmsg>${esc(d.reason_code||d.result)}：${esc(d.detail||'')}</li>`)}}
async function load(){board=await (await fetch('/api/storm/board')).json();fill('batch',board.batches,b=>`${b.id} / ${b.status}`,b=>b.id);fill('person',board.roster,p=>`${p.name}${p.onsite?'':'（已离场）'}`,p=>p.id);$('batch').value=batch||$('batch').value;batch=$('batch').value;if(batch){const b=await (await fetch('/api/storm/batches/'+batch)).json();fill('risk',b.risks,r=>`${r.id} ${r.device}`,r=>r.id);fill('tool',b.tools,t=>`${t.serial} (${t.code})`,t=>t.serial);render(b)}}
function fill(id,rows,label,val){const cur=$(id).value;$(id).innerHTML='';rows.forEach(x=>{const o=document.createElement('option');o.value=val(x);o.textContent=label(x);$(id).appendChild(o)});if(cur)$(id).value=cur}
function render(b){const p=board.roster.find(x=>x.id===$('person').value);const c=b.checkins.find(x=>x.person===p?.id);$('me').innerHTML=c?`<span class="pill">当前有效：${c.shelter_name} · ${c.safe?'已确认安全':'未确认安全'}</span><p class=mono>checkin=${c.id}</p>`:'<span class=bad>尚无有效签到</span>';const oi=b.open_items;$('items').innerHTML=`<table><tr><th>人员缺失</th><td>${oi.missing_persons.map(x=>esc(x.name)+'('+esc(x.reason)+')').join('、')||'无'}</td></tr><tr><th>器具未清</th><td>${[...oi.unknown_tools,...oi.conflict_tools].map(x=>esc(x.serial)+'('+esc(x.reason||x.detail||'不明')+')').join('、')||'无'}</td></tr><tr><th>风险无监护</th><td>${oi.unguarded_risks.map(x=>esc(x.id)).join('、')||'无'}</td></tr><tr><th>双确认</th><td>${b.field_confirm?'现场 '+b.field_confirm.status+' '+b.field_confirm.env_version:'现场—'} / ${b.dispatch_confirm?'调度 '+b.dispatch_confirm.status+' '+b.dispatch_confirm.env_version:'调度—'}</td></tr></table>`}
async function checkin(sh,safe){await api('POST',`/api/storm/batches/${$('batch').value}/checkins`,{person:$('person').value,shelter:sh,safe});await load()}async function confirmSafe(){const b=await api('GET','/api/storm/batches/'+$('batch').value);const c=b.checkins.find(x=>x.person===$('person').value);if(!c)return show({detail:'尚无扫码记录，不能补确认安全'});await api('POST',`/api/storm/batches/${$('batch').value}/checkins`,{person:$('person').value,shelter:c.shelter,safe:true,key:'safe-'+c.id});await load()}
function proxyTest(){return api('POST',`/api/storm/batches/${$('batch').value}/checkins`,{person:'P-ZHANG',shelter:'SH-A',claimed_by:'P-LI',key:'proxy-demo'}).catch(()=>{})}async function correct(sh){await api('POST',`/api/storm/batches/${$('batch').value}/correct-destination`,{person:$('person').value,shelter:sh});await load()}async function guard(){await api('POST',`/api/storm/batches/${$('batch').value}/risk-guards`,{risk:$('risk').value,guardian:$('person').value,shelter:'SH-A'});await load()}async function reportTool(force){await api('POST',`/api/storm/batches/${$('batch').value}/tool-reports`,{serial:$('tool').value,location:$('location').value,held_by:$('person').value,shelter:'SH-A',actor:$('person').value,force_correct:force});await load()}async function fieldConfirm(){await api('POST',`/api/storm/batches/${$('batch').value}/field-confirm`,{actor:'P-CHEN'});await load()}
$('batch').addEventListener('change',load);$('person').addEventListener('change',load);load();
</script></body></html>
